<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethal Orca - Ocean Jump P2E</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b132b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            font-size: 24px;
            color: #00f5d4;
            text-shadow: 0 0 10px rgba(0,245,212,0.5);
        }
        canvas {
            border: 4px solid #3a86ff;
            box-shadow: 0 0 20px rgba(58,134,255,0.6);
            background: linear-gradient(to bottom, #1d3557, #03045e);
            border-radius: 10px;
        }
        .ui-panel {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .token-badge {
            color: #ff007f;
            background: rgba(255, 0, 127, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #ff007f;
        }
    </style>
</head>
<body>

    <h1>Lethal Orca: Ocean Jump</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="ui-panel">
        Score: <span id="scoreVal">0</span> | <span class="token-badge">LORCA Earned: <span id="tokenVal">0.00</span></span>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Variables
let score = 0;
let tokens = 0.0;
let isGameOver = false;

// Orca (Player) on the right side moving/jumping
let orca = {
    x: 150,
    y: 300,
    width: 60,
    height: 30,
    dy: 0,
    gravity: 0.6,
    jumpPower: -11,
    ground: 300,
    isJumping: false
};

// Obstacle (Rocks / Hazards) moving from right to left (so Orca faces right)
let obstacle = {
    x: 850,
    y: 310,
    width: 25,
    height: 40,
    speed: 5
};

// Coin Reward
let coin = {
    x: 950,
    y: 220,
    radius: 12,
    speed: 5
};

// Controls (Jump on Spacebar or Click)
window.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        triggerJump();
    }
});
canvas.addEventListener("click", function() {
    triggerJump();
});

function triggerJump() {
    if (!orca.isJumping && !isGameOver) {
        orca.dy = orca.jumpPower;
        orca.isJumping = true;
    } else if (isGameOver) {
        resetGame();
    }
}

function resetGame() {
    score = 0;
    tokens = 0.0;
    isGameOver = false;
    obstacle.x = 850;
    coin.x = 950;
    loop();
}

// Main Game Loop
function update() {
    if (isGameOver) return;

    // Orca Physics
    orca.dy += orca.gravity;
    orca.y += orca.dy;

    if (orca.y > orca.ground) {
        orca.y = orca.ground;
        orca.dy = 0;
        orca.isJumping = false;
    }

    // Move Obstacle & Coin towards left (giving feeling of rightward movement)
    obstacle.x -= obstacle.speed;
    if (obstacle.x < -30) {
        obstacle.x = 850 + Math.random() * 200;
        score += 10;
    }

    coin.x -= coin.speed;
    if (coin.x < -30) {
        coin.x = 850 + Math.random() * 300;
        coin.y = 180 + Math.random() * 100;
    }

    // Collision Detection with Coin (P2E Reward)
    let dist = Math.hypot((orca.x + orca.width/2) - coin.x, (orca.y + orca.height/2) - coin.y);
    if (dist < orca.width/2 + coin.radius) {
        tokens += 1.50; // Earn reward tokens
        coin.x = 900 + Math.random() * 200;
        coin.y = 180 + Math.random() * 100;
    }

    // Collision Detection with Obstacle (Game Over)
    if (
        orca.x < obstacle.x + obstacle.width &&
        orca.x + orca.width > obstacle.x &&
        orca.y < obstacle.y + obstacle.height &&
        orca.y + orca.height > obstacle.y
    ) {
        isGameOver = true;
    }

    // Update UI
    document.getElementById("scoreVal").innerText = score;
    document.getElementById("tokenVal").innerText = tokens.toFixed(2);
}

function draw() {
    // Clear Screen (Ocean Background)
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Sea Floor / Horizon line
    ctx.strokeStyle = "#00f5d4";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 335);
    ctx.lineTo(800, 335);
    ctx.stroke();

    // Draw Lethal Orca (Sleek Shark-like body with dorsal fin)
    ctx.fillStyle = "#111"; // Body
    ctx.beginPath();
    ctx.ellipse(orca.x + 30, orca.y + 15, 30, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    // Orca White Patch & Dorsal Fin
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(orca.x + 25, orca.y + 18, 15, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111"; // Fin
    ctx.beginPath();
    ctx.moveTo(orca.x + 20, orca.y);
    ctx.lineTo(orca.x + 35, orca.y - 15);
    ctx.lineTo(orca.x + 40, orca.y);
    ctx.closePath();
    ctx.fill();

    // Draw Obstacle (Coral / Rock)
    ctx.fillStyle = "#e63946";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // Draw P2E Coin Reward ($LORCA token)
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d4af37";
    ctx.font = "bold 12px Arial";
    ctx.fillText("🪙", coin.x - 7, coin.y + 4);

    // Game Over Overlay
    if (isGameOver) {
        ctx.fillStyle = "rgba(3, 4, 94, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ff007f";
        ctx.font = "bold 32px Arial";
        ctx.fillText("GAME OVER", 290, 180);
        
        ctx.fillStyle = "#fff";
        ctx.font = "18px Arial";
        ctx.fillText("Click or Press Space to Restart", 265, 230);
    }
}

function loop() {
    update();
    draw();
    if (!isGameOver) {
        requestAnimationFrame(loop);
    } else {
        draw(); // draw final frame
    }
}

// Start Game Loop
loop();
</script>

</body>
</html>
