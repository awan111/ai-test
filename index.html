<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethal Orca - Ocean Jump P2E</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #03045e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            font-size: 24px;
            color: #00f5d4;
            text-shadow: 0 0 10px rgba(0,245,212,0.5);
        }
        canvas {
            border: 4px solid #00b4d8;
            box-shadow: 0 0 25px rgba(0,180,216,0.6);
            background: linear-gradient(to bottom, #0077b6, #03045e);
            border-radius: 12px;
        }
        .ui-panel {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
        }
        .token-badge {
            color: #ff007f;
            background: rgba(255, 0, 127, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #ff007f;
        }
    </style>
</head>
<body>

    <h1>Lethal Orca ($LORCA) - Ocean Jump</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="ui-panel">
        Score: <span id="scoreVal">0</span> | <span class="token-badge">$LORCA Earned: <span id="tokenVal">0.00</span></span>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Variables
let score = 0;
let tokens = 0.0;
let isGameOver = false;

// Orca Player (Right side positioning)
let orca = {
    x: 150,
    y: 280,
    width: 65,
    height: 35,
    dy: 0,
    gravity: 0.55,
    jumpPower: -10.5,
    ground: 280,
    isJumping: false
};

// Ocean Obstacle (Reef / Rock moving right-to-left effect)
let obstacle = {
    x: 850,
    y: 285,
    width: 30,
    height: 40,
    speed: 5.5
};

// P2E Token Reward Coin
let coin = {
    x: 950,
    y: 190,
    radius: 12,
    speed: 5.5
};

// Controls (Spacebar or Mouse/Touch Click)
window.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        triggerJump();
    }
});
canvas.addEventListener("click", function() {
    triggerJump();
});

function triggerJump() {
    if (!orca.isJumping && !isGameOver) {
        orca.dy = orca.jumpPower;
        orca.isJumping = true;
    } else if (isGameOver) {
        resetGame();
    }
}

function resetGame() {
    score = 0;
    tokens = 0.0;
    isGameOver = false;
    obstacle.x = 850;
    coin.x = 950;
    loop();
}

// Game Update Logic
function update() {
    if (isGameOver) return;

    // Orca Physics
    orca.dy += orca.gravity;
    orca.y += orca.dy;

    if (orca.y > orca.ground) {
        orca.y = orca.ground;
        orca.dy = 0;
        orca.isJumping = false;
    }

    // Move Obstacle & Coin
    obstacle.x -= obstacle.speed;
    if (obstacle.x < -40) {
        obstacle.x = 850 + Math.random() * 250;
        score += 10;
    }

    coin.x -= coin.speed;
    if (coin.x < -40) {
        coin.x = 850 + Math.random() * 300;
        coin.y = 150 + Math.random() * 110;
    }

    // Collision with P2E Coin ($LORCA)
    let dist = Math.hypot((orca.x + orca.width/2) - coin.x, (orca.y + orca.height/2) - coin.y);
    if (dist < orca.width/2 + coin.radius) {
        tokens += 2.50; // Earn reward tokens
        coin.x = 900 + Math.random() * 250;
        coin.y = 150 + Math.random() * 110;
    }

    // Collision with Obstacle (Game Over)
    if (
        orca.x < obstacle.x + obstacle.width &&
        orca.x + orca.width > obstacle.x &&
        orca.y < obstacle.y + obstacle.height &&
        orca.y + orca.height > obstacle.y
    ) {
        isGameOver = true;
    }

    // Update UI Elements
    document.getElementById("scoreVal").innerText = score;
    document.getElementById("tokenVal").innerText = tokens.toFixed(2);
}

// Render Graphics
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Ocean Floor Line
    ctx.strokeStyle = "#00f5d4";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 320);
    ctx.lineTo(800, 320);
    ctx.stroke();

    // Draw Lethal Orca Body
    ctx.fillStyle = "#111b27";
    ctx.beginPath();
    ctx.ellipse(orca.x + 32, orca.y + 18, 32, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // Orca Belly White Patch
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(orca.x + 28, orca.y + 21, 16, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Dorsal Fin
    ctx.fillStyle = "#111b27";
    ctx.beginPath();
    ctx.moveTo(orca.x + 22, orca.y + 4);
    ctx.lineTo(orca.x + 38, orca.y - 14);
    ctx.lineTo(orca.x + 42, orca.y + 4);
    ctx.closePath();
    ctx.fill();

    // Draw Ocean Obstacle (Reef/Rock)
    ctx.fillStyle = "#ff5964";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // Draw $LORCA Coin Reward
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d4af37";
    ctx.font = "bold 13px Arial";
    ctx.fillText("🪙", coin.x - 7, coin.y + 5);

    // Game Over Screen
    if (isGameOver) {
        ctx.fillStyle = "rgba(3, 4, 94, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ff007f";
        ctx.font = "bold 32px Arial";
        ctx.fillText("GAME OVER", 290, 175);
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "17px Arial";
        ctx.fillText("Click or Press Space to Play Again", 260, 225);
    }
}

function loop() {
    update();
    draw();
    if (!isGameOver) {
        requestAnimationFrame(loop);
    } else {
        draw();
    }
}

// Initialize Game Loop
loop();
</script>

</body>
</html>
