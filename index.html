<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LethalOrca — $LORCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --abyss: #020910;
    --deep: #05121e;
    --deep2: #081a2b;
    --teal: #2dd4bf;
    --teal-glow: #5eead4;
    --gold: #f2c94c;
    --gold-glow: #ffdf7e;
    --ink: #f4fcfc;
    --muted: #8ab4b4;
    --line: rgba(94, 234, 212, 0.2);
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--abyss);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--teal-glow); text-decoration: none; }

  .noise-layer {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, rgba(45,212,191,0.08), transparent 40%),
                        radial-gradient(circle at 80% 60%, rgba(242,201,76,0.05), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 5%;
    z-index: 100;
    backdrop-filter: blur(16px);
    background: rgba(2,9,16,0.85);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .brand {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  /* Updated navbar dot to Gold Glow */
  .brand .dot { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: var(--gold); 
    box-shadow: 0 0 16px var(--gold), 0 0 8px var(--gold-glow); 
  }
  
  /* Updated all nav links to have a default Gold Glow */
  nav .links { 
    display: flex; 
    gap: 24px; 
    font-size: 14px; 
    align-items: center; 
  }
  nav .links a {
    color: var(--gold);
    text-shadow: 0 0 8px rgba(242,201,76,0.4);
    transition: all 0.3s ease;
  }
  nav .links a:hover { 
    color: var(--gold-glow); 
    text-shadow: 0 0 15px rgba(242,201,76,0.8); 
  }

  section { position: relative; z-index: 1; padding: 120px 5% 80px; max-width: 1240px; margin: 0 auto; }

  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 90px;
    position: relative;
  }
  .depth-tag {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--teal);
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(45,212,191,0.3);
  }
  h1.hero-title {
    font-family: var(--display);
    font-size: clamp(40px, 7vw, 100px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -1.5px;
    background: linear-gradient(180deg, #ffffff 0%, var(--teal-glow) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 25px rgba(94,234,212,0.2));
  }
  .hero-sub {
    font-size: 17px;
    color: var(--muted);
    max-width: 580px;
    margin-top: 20px;
  }
  
  .hero-cta { 
    display: flex; 
    gap: 14px; 
    margin-top: 32px; 
    flex-wrap: wrap; 
  }
  .btn {
    font-family: var(--body);
    font-weight: 600;
    font-size: 14px;
    padding: 14px 24px;
    border-radius: 100px;
    border: 1px solid var(--line);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    text-align: center;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--teal-glow), var(--teal));
    color: var(--abyss);
